# Local production-like stack: API + Postgres + email worker
# Usage: cp .env.example .env && docker compose up --build
# API is published at http://127.0.0.1:5001 (container :5000) so host :5000 stays free for npm run dev.
# Do not use the default DB password outside local/dev.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host 5433 — Windows often already runs native Postgres on :5432 (postgresql-x64-*).
    # Containers still talk to db:5432 on the Compose network; this publish is host-only access.
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    # Host 5001 — leaves :5000 free for local `npm run dev` / Playwright (avoids dual-bind traps on Windows)
    ports:
      - '127.0.0.1:5001:5000'
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: 'false'
      DB_POOL_MAX: 20
      TRUST_PROXY_HOPS: 1
      UV_THREADPOOL_SIZE: 8
      EMAIL_USE_QUEUE: 'true'
      ALLOW_MOCK_PAYMENT: 'false'
      # Never inherit local Playwright bypass flags from env_file
      E2E_RELAX_RATE_LIMIT: 'false'
      LOAD_TEST_BYPASS: '0'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/migrate.mjs && node server.js"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/api/health/ready']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s

  email-worker:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: 'false'
      EMAIL_USE_QUEUE: 'true'
    depends_on:
      api:
        condition: service_healthy
    command: node scripts/email-worker.mjs
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  pgdata:
