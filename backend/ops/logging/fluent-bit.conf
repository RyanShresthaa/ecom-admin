# Fluent Bit — ship JSON stdout logs to Loki / CloudWatch / Elasticsearch / Datadog
# Easiest path for containers: Fluent Bit as DaemonSet or sidecar reading container stdout.
#
# App already emits structured JSON when LOG_FORMAT=json (default in .env.example).

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

# Alternative: tail Docker json-file logs
# [INPUT]
#     Name              tail
#     Path              /var/log/containers/*ecommerce-api*.log
#     Parser            docker
#     Tag               api.*
#     Mem_Buf_Limit     25MB
#     Skip_Long_Lines   On

[FILTER]
    Name              parser
    Match             *
    Key_Name          log
    Parser            json
    Reserve_Data      On

# ── Loki (recommended with Grafana) ──
[OUTPUT]
    Name              loki
    Match             *
    Host              loki
    Port              3100
    Labels            job=ecommerce-api,env=${ENV}
    Line_Format       json
    auto_kubernetes_labels off

# ── CloudWatch (uncomment) ──
# [OUTPUT]
#     Name                cloudwatch_logs
#     Match               *
#     region              us-east-1
#     log_group_name      /ecommerce/api
#     log_stream_prefix   api-
#     auto_create_group   true

# ── Elasticsearch / OpenSearch ──
# [OUTPUT]
#     Name            es
#     Match           *
#     Host            elasticsearch
#     Port            9200
#     Index           ecommerce-api
#     Suppress_Type_Name On

# ── Datadog ──
# [OUTPUT]
#     Name          datadog
#     Match         *
#     Host          http-intake.logs.datadoghq.com
#     TLS           On
#     compress      gzip
#     apikey        ${DD_API_KEY}
#     dd_service    ecommerce-api
#     dd_source     nodejs
#     dd_tags       env:${ENV}
