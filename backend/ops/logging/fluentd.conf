# Fluentd — alternative to Fluent Bit (heavier). Prefer Fluent Bit unless you already run Fluentd.
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter **>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
    time_key ts
    time_format iso8601
  </parse>
</filter>

# Loki
<match **>
  @type loki
  url "http://loki:3100"
  extra_labels {"job":"ecommerce-api"}
  <label>
    level
    message
  </label>
  <buffer>
    flush_interval 5s
  </buffer>
</match>

