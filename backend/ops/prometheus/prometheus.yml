# Prometheus scrape config for local / compose observability stack.
# Mount secrets/metrics_token.txt as /etc/prometheus/metrics_token (see docker-compose.observability.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecommerce-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          service: ecommerce-api

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          exporter: node
