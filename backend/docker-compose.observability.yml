# Optional observability stack: Prometheus + node_exporter + Loki + Grafana + Fluent Bit
# Usage (from backend/):
#   printf 'your-metrics-token' > secrets/metrics_token.txt
#   docker compose -f docker-compose.observability.yml up -d
#
# Grafana: http://localhost:3000  (admin / admin — change immediately)
# Prometheus: http://localhost:9090
# Loki: http://localhost:3100
# Forward app logs: configure Docker logging driver or push to fluent-bit:24224

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_token.txt:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - '127.0.0.1:9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - node-exporter
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - '9100'
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    volumes:
      - ./ops/logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./ops/logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    ports:
      - '127.0.0.1:24224:24224'
    environment:
      ENV: ${ENV:-local}
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
